<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftCart - E-Commerce</title>
    <link rel="stylesheet" href="style.css">

    <!-- DaisyUI & Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Feather Icons CDN -->
    <script src="https://unpkg.com/feather-icons"></script>

    <!-- Custom Config for Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7c3aed', // Violet-600 (Main Theme Color)
                        secondary: '#ddd6fe', // Violet-200 (Light Background)
                        dark: '#0f172a', // Footer Background
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

</head>
<body class="bg-white text-gray-800">

<!-- ✅ Navbar  -->
    <nav class="fixed top-0 w-full z-50 bg-white/75 backdrop-blur-md shadow-sm border-b border-gray-100">
        <div class="container mx-auto px-4 md:px-12">
            <div class="navbar flex justify-between items-center min-h-[4rem] px-0">
                
                <!-- 1. Logo (Left Side) -->
                <div class="navbar-start w-auto">
                    <a href="index.html" class="text-2xl font-bold text-primary tracking-tight">SwiftCart</a>
                </div>
                
                <!-- 2. Desktop Menu (Center) -->
                <div class="navbar-center hidden lg:flex">
                    <ul class="menu menu-horizontal px-1 gap-8 text-sm font-medium text-gray-600">
                        <li><a href="index.html" class="hover:text-primary transition">Home</a></li>
                        <li><a href="products.html" class="hover:text-primary transition">Products</a></li>
                        <li><a href="about.html" class="hover:text-primary transition">About</a></li>
                        <li><a href="contact.html" class="hover:text-primary transition">Contact</a></li>
                    </ul>
                </div>
                
                <!-- 3. Cart & Mobile Menu (Right Side) -->
                <div class="flex gap-3 ">
                    
                    <!-- Cart Icon -->
                    <div onclick="openCartModal()" class="relative cursor-pointer hover:text-primary transition p-2">
                        <span id="cart-count" class="absolute -top-1 -right-1 bg-primary text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">0</span> 
                        <i data-feather="shopping-cart" class="w-5 h-5 text-gray-700"></i>
                    </div>

                    <!-- Mobile Hamburger Menu (Right Side) -->
                    <div class="dropdown dropdown-end lg:hidden">
                        <div tabindex="0" role="button" class="btn btn-ghost btn-circle pl-0">
                            <i data-feather="menu" class="w-6 h-6 text-gray-700"></i>
                        </div>
                        <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow-lg bg-white rounded-box w-32 border border-gray-100">
                            <li><a href="index.html">Home</a></li>
                            <li><a href="products.html">Products</a></li>
                            <li><a href="about.html">About</a></li>
                            <li><a href="contact.html">Contact</a></li>
                        </ul>
                    </div>

                </div>
            </div>
        </div>
    </nav>

<!-- Hero Section -->
    <section class="relative w-full h-[550px] md:h-[650px] mt-16 flex items-center bg-cover bg-center bg-no-repeat" 
        style="background-image: url('https://images.unsplash.com/photo-1483985988355-763728e1935b?q=80&w=2070&auto=format&fit=crop');">
        
        <!-- Black Overlay  -->
        <div class="absolute inset-0 bg-black/60"></div>

        <!-- Content -->
        <div class="container mx-auto px-4 md:px-12 relative z-10">
            <div class="max-w-2xl text-white">
                <h1 class="text-4xl md:text-6xl font-bold leading-tight mb-6">
                    Best Collection <br> For You
                </h1>
                <p class="text-lg md:text-xl text-gray-200 mb-8 max-w-lg">
                    Discover the latest trends in fashion, electronics, and more. Shop with confidence and style at SwiftCart.
                </p>
                <button class="btn btn-primary px-8 py-3 h-auto text-base text-white border-none hover:bg-violet-700 shadow-lg shadow-violet-900/50 rounded-md">
                    Shop Now
                </button>
            </div>
        </div>
    </section>

    <!-- Script Link -->
    <script src="./script.js"></script>

</body>
</html>
